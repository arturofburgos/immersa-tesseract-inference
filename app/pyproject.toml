[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "immersa_tesseract_inference"
dynamic = ["version"]
description = "Differentiable immersed-body geometry inference from sparse wake observations using Immersa.jl and Tesseract"
authors = [{ name = "Arturo Machado Burgos" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tesseract-core",
    "typer>=0.9.0",
    # Add more dependencies here
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # For running app/chain.ipynb
    "jupyter",
    "matplotlib",
]

[project.scripts]
"immersa_tesseract_inference" = "immersa_tesseract_inference.main:entrypoint"

# Version is derived from git tags via hatch-vcs. Tag a release (e.g. `git tag
# v0.1.0`) to set the version; between tags it is inferred from the latest tag
# plus commit distance. `raw-options.root` points at the repository root one
# level up, since this package lives in the `app/` subdirectory of the monorepo.
# `fallback-version` keeps builds working when git metadata is unavailable
# (e.g. building from an sdist or outside a checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "immersa_tesseract_inference/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["immersa_tesseract_inference"]
